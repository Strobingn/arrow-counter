name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build React app
      run: npm run build
    
    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli
        npm install @capacitor/android
    
    - name: Init Capacitor config (if not exists)
      run: |
        if [ ! -f capacitor.config.ts ]; then
          npx cap init "Arrow Counter" com.arrowcounter.app --web-dir dist
        fi
    
    - name: Add Android platform
      run: npx cap add android || echo "Android already exists"
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      working-directory: .
    
    - name: Build APK
      run: |
        cd android
        ./gradlew assembleRelease
    
    - name: Sign APK (optional debug signing)
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      continue-on-error: true
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: arrow-counter-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 5
    
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: true
        title: "Development Build"
        files: |
          android/app/build/outputs/apk/release/app-release-unsigned.apk
