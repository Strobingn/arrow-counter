name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build React app
      run: npm run build
    
    - name: Copy web assets to Android
      run: npx cap copy android
    
    - name: Create cordova plugins stub
      run: |
        mkdir -p android/capacitor-cordova-android-plugins/src/main
        echo '<?xml version="1.0" encoding="utf-8"?><manifest package="capacitor.cordova.android.plugins" xmlns:android="http://schemas.android.com/apk/res/android"/>' > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
        echo '// DO NOT EDIT - generated by cap sync' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo 'android { namespace = "capacitor.cordova.android.plugins" }' > android/capacitor-cordova-android-plugins/build.gradle
    
    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug --no-daemon
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
    
    - name: Build Release APK
      run: cd android && ./gradlew assembleRelease --no-daemon
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: arrow-counter-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: arrow-counter-release
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 7
